<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06223a">
  <title>Погружение — 11 километров вниз</title>
  <meta name="description" content="Документальное погружение от поверхности океана до дна Марианской впадины.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Атмосфера: вода, лучи, частицы -->
  <div class="water" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <canvas class="particles" id="particles" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Навигация -->
  <header class="nav">
    <a class="brand" href="#top" id="brand">Погружение</a>
    <div class="nav-depth" aria-live="off">
      <span class="nav-depth-num"><b id="navDepth">0</b> м</span>
      <span class="nav-depth-zone" id="navZone">Солнечная зона</span>
    </div>
    <button class="nav-btn" id="indexBtn" type="button">Все виды</button>
  </header>
  <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>

  <!-- Глубиномер (на больших экранах) -->
  <aside class="gauge" aria-label="Глубиномер">
    <div class="gauge-read"><span class="gauge-num" id="gaugeNum">0</span><span class="gauge-unit">м</span></div>
    <div class="gauge-zone" id="gaugeZone">Солнечная зона</div>
    <div class="gauge-track">
      <div class="gauge-fill" id="gaugeFill"></div>
      <div class="gauge-ticks" id="gaugeTicks"></div>
    </div>
  </aside>

  <!-- История погружения собирается из animals.js и STORY в script.js -->
  <main id="story"></main>

  <!-- Карточка вида -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-dim" data-close></div>
    <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <button class="drawer-close" type="button" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="drawer-scroll" id="dScroll">
        <div class="drawer-media" id="dMedia"></div>
        <div class="drawer-body">
          <p class="eyebrow" id="dEyebrow"></p>
          <h2 class="drawer-title" id="dTitle"></h2>
          <p class="latin" id="dLatin"></p>
          <p class="lead" id="dTag"></p>
          <dl class="specs" id="dSpecs"></dl>
          <h3 class="facts-title">Три факта</h3>
          <ol class="facts" id="dFacts"></ol>
          <div id="dGame"></div>
        </div>
      </div>
      <nav class="drawer-nav">
        <button type="button" id="dPrev"><span class="arr">←</span><span class="lbl"></span></button>
        <span class="drawer-count" id="dCount"></span>
        <button type="button" id="dNext"><span class="lbl"></span><span class="arr">→</span></button>
      </nav>
    </article>
  </div>

  <!-- Указатель всех видов -->
  <div class="index" id="index" hidden>
    <div class="index-inner">
      <div class="index-head">
        <p class="eyebrow">Указатель</p>
        <h2 class="index-title">Все виды погружения</h2>
        <button class="drawer-close index-close" type="button" id="indexClose" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="index-list" id="indexList"></div>
    </div>
  </div>


  <!-- ===================== ЭКСПЕДИЦИЯ ===================== -->
  <div class="hud" id="hud" hidden>
    <button class="hud-task" id="hudTask" type="button">
      <span class="hud-k" id="hudAct"></span>
      <span class="hud-t" id="hudGoal"></span>
      <span class="hud-bar"><i id="hudBar"></i></span>
    </button>
    <button class="hud-radio" id="hudRadio" type="button" hidden aria-label="Сеанс связи">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 13v8M9 21h6M8.5 9.5a5 5 0 0 1 7 0M5.6 6.6a9 9 0 0 1 12.8 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="12" cy="12.5" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="hud-journal" id="hudJournal" type="button"><span>Журнал</span><b id="hudData">0</b></button>
  </div>

  <div class="radio" id="radio" hidden role="dialog" aria-live="polite">
    <div class="radio-head"><span class="radio-dot"></span><span id="radioFrom">Связь</span><span class="radio-count" id="radioCount"></span></div>
    <p class="radio-text" id="radioText"></p>
    <div class="radio-extra" id="radioExtra"></div>
    <button class="g-btn" type="button" id="radioOk">Принято</button>
  </div>

  <div class="journal" id="journal" hidden>
    <div class="j-panel" role="dialog" aria-modal="true" aria-labelledby="jTitle">
      <header class="j-head">
        <div><p class="eyebrow" id="jSub"></p><h2 id="jTitle">Журнал экспедиции</h2></div>
        <button class="drawer-close j-close" type="button" id="jClose" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>
      <nav class="j-tabs" id="jTabs" role="tablist"></nav>
      <div class="j-body" id="jBody"></div>
    </div>
  </div>

  <div class="prologue" id="prologue" hidden>
    <div class="pro-inner">
      <p class="eyebrow">Экспедиция «Зов глубины» · 1997</p>
      <canvas class="pro-wave" id="proWave" aria-hidden="true"></canvas>
      <button class="g-link" type="button" id="proPlay">▶ Звуковая модель сигнала</button>
      <div id="proStory">
        <p class="pro-text" id="proText"></p>
        <button class="g-btn" type="button" id="proNext">Дальше</button>
      </div>
      <div id="proName" hidden>
        <p class="pro-text">Как назовём наш батискаф?</p>
        <input class="g-input" id="subName" maxlength="24" placeholder="Например, «Наутилус»" autocomplete="off">
        <button class="g-btn" type="button" id="proStart">Начать погружение</button>
      </div>
      <button class="g-link pro-code-btn" type="button" id="proHaveCode">У меня есть код экспедиции</button>
      <div class="pro-code" id="proCode" hidden>
        <input class="g-input" id="proCodeIn" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XX" autocomplete="off" spellcheck="false">
        <button class="g-btn" type="button" id="proCodeGo">Продолжить</button>
        <p class="ded-fb" id="proCodeFb"></p>
      </div>
    </div>
  </div>

  <div class="finale" id="finale" hidden>
    <div class="fin-inner" id="finBody"></div>
  </div>

  <div class="g-toasts" id="gToasts" aria-live="polite"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/ScrollToPlugin.min.js"></script>
  <script src="animals.js"></script>
  <script src="expedition.js"></script>
  <script src="script.js"></script>
  <script src="game.js"></script>
</body>
</html>
