l="none"/><path d="M78,45.1 Q84,80 78,114.9" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M92,42.2 Q98,80 92,117.8" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M106,40.5 Q112,80 106,119.5" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M120,40.0 Q126,80 120,120.0" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M134,40.5 Q140,80 134,119.5" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M148,42.2 Q154,80 148,117.8" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M162,45.1 Q168,80 162,114.9" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M176,49.6 Q182,80 176,110.4" stroke="#8e7c90" stroke-width="1.6" fill="none"/><path d="M38,80 C38,62 46,54 60,52 L62,108 C46,106 38,98 38,80 Z" fill="#d8ccd6" stroke="#8e7c90" stroke-width="1.6"/><ellipse cx="52" cy="58" rx="6" ry="8" fill="#2c2430"/><ellipse cx="52" cy="102" rx="6" ry="8" fill="#2c2430"/><circle cx="50" cy="55" r="1.8" fill="#fff" opacity=".8"/><circle cx="50" cy="99" r="1.8" fill="#fff" opacity=".8"/></g></svg>