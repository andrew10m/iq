<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160"><style>
.a{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.t{transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.3s ease-in-out infinite alternate}
.tf{transform-box:fill-box;transform-origin:0% 50%;animation:wag 2.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.f{transform-box:fill-box;transform-origin:50% 0%;animation:fin 1.1s ease-in-out infinite alternate}
.fr{transform-box:fill-box;transform-origin:0% 50%;animation:fin 1.1s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:100% 50%;animation:finl 1.1s ease-in-out infinite alternate}
@keyframes fin{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes finl{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
.l{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.g{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:1}}
.p{transform-box:fill-box;transform-origin:50% 0%;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06,.9)}}
.w{transform-box:fill-box;transform-origin:50% 0%;animation:wave 2.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{50%{transform:scale(.96,.78)}}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:sq 3s ease-in-out infinite}
@keyframes sq{50%{transform:scale(1.04,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c3bb"/><stop offset="0.6" stop-color="#f5d2cb"/><stop offset="1" stop-color="#e7aaa1"/></linearGradient></defs><g class="a"><path class="t" d="M200,80 C212,72 222,72 226,76 C222,82 222,86 226,92 C220,94 210,92 200,86 Z" fill="#eab3aa" opacity=".9"/><path d="M40,84 C36,56 64,40 96,42 C126,44 140,62 150,70 C176,76 196,78 206,82 C196,90 176,92 150,96 C140,108 120,122 92,122 C60,122 42,108 40,84 Z" fill="url(#b)"/><ellipse cx="88" cy="56" rx="22" ry="8" fill="#fff" opacity=".35"/><path d="M38,76 C24,78 21,94 33,99 C42,100 45,92 41,84 Z" fill="#e8a99f"/><path d="M44,106 Q60,99 78,107" stroke="#b9746b" stroke-width="2.2" fill="none" stroke-linecap="round"/><path class="fr" d="M112,96 C124,92 134,98 134,108 C126,108 118,106 112,102 Z" fill="#eab3aa"/><circle cx="66" cy="72" r="3.2" fill="#0b1020"/><circle cx="64.9" cy="70.8" r="1.2" fill="#fff"/><ellipse class="l" cx="66" cy="72" rx="3.7" ry="3.7" fill="#f0c3bb"/></g></svg>