" fill="#c46a3a"/><circle cx="40" cy="72" r="2.8" fill="#0b1020"/><circle cx="39.0" cy="70.9" r="1.0" fill="#fff"/><ellipse class="l" cx="40" cy="72" rx="3.9" ry="3.9" fill="#3c4140"/></g></svg>