<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160"><style>
.a{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.t{transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.3s ease-in-out infinite alternate}
.tf{transform-box:fill-box;transform-origin:0% 50%;animation:wag 2.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.f{transform-box:fill-box;transform-origin:50% 0%;animation:fin 1.1s ease-in-out infinite alternate}
.fr{transform-box:fill-box;transform-origin:0% 50%;animation:fin 1.1s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:100% 50%;animation:finl 1.1s ease-in-out infinite alternate}
@keyframes fin{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes finl{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
.l{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.g{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:1}}
.p{transform-box:fill-box;transform-origin:50% 0%;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06,.9)}}
.w{transform-box:fill-box;transform-origin:50% 0%;animation:wave 2.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{50%{transform:scale(.96,.78)}}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:sq 3s ease-in-out infinite}
@keyframes sq{50%{transform:scale(1.04,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7b6da"/><stop offset="1" stop-color="#c487b4"/></linearGradient></defs><g class="a"><path class="w" style="animation-delay:-0.00s" d="M62,104 C60,114 58,120 56,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-0.25s" d="M84,104 C82,114 80,120 78,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-0.50s" d="M106,104 C104,114 102,120 100,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-0.75s" d="M128,104 C126,114 124,120 122,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-1.00s" d="M150,104 C148,114 146,120 144,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-1.25s" d="M172,104 C170,114 168,120 166,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-1.50s" d="M194,104 C192,114 190,120 188,124" stroke="#d9a2c8" stroke-width="7" stroke-linecap="round" fill="none"/><path class="w" d="M92,68 C86,52 78,38 70,28" stroke="#e1abd0" stroke-width="6" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-.6s" d="M112,66 C110,50 104,36 100,26" stroke="#e1abd0" stroke-width="6" stroke-linecap="round" fill="none"/><path class="w" style="animation-delay:-1s" d="M134,66 C136,58 136,52 134,46" stroke="#e1abd0" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M40,94 C40,72 70,64 120,64 C170,64 200,74 204,94 C204,108 180,112 120,112 C60,112 40,108 40,94 Z" fill="url(#b)" fill-opacity=".95"/><ellipse cx="110" cy="76" rx="40" ry="6" fill="#fff" opacity=".35"/><circle cx="38" cy="84" r="2.4" fill="#f0c5e2"/><circle cx="37" cy="88" r="2.4" fill="#f0c5e2"/><circle cx="36" cy="92" r="2.4" fill="#f0c5e2"/><circle cx="35" cy="96" r="2.4" fill="#f0c5e2"/><circle cx="34" cy="100" r="2.4" fill="#f0c5e2"/></g></svg>