<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160"><style>
.a{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.t{transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.3s ease-in-out infinite alternate}
.tf{transform-box:fill-box;transform-origin:0% 50%;animation:wag 2.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.f{transform-box:fill-box;transform-origin:50% 0%;animation:fin 1.1s ease-in-out infinite alternate}
.fr{transform-box:fill-box;transform-origin:0% 50%;animation:fin 1.1s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:100% 50%;animation:finl 1.1s ease-in-out infinite alternate}
@keyframes fin{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes finl{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
.l{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.g{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:1}}
.p{transform-box:fill-box;transform-origin:50% 0%;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06,.9)}}
.w{transform-box:fill-box;transform-origin:50% 0%;animation:wave 2.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{50%{transform:scale(.96,.78)}}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:sq 3s ease-in-out infinite}
@keyframes sq{50%{transform:scale(1.04,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2aa865"/><stop offset="1" stop-color="#7ad17a"/></linearGradient></defs><g class="a"><path d="M86,97 l-3,12" stroke="#3a7bd5" stroke-width="2.6" stroke-linecap="round"/><path d="M98,97 l-3,12" stroke="#3a7bd5" stroke-width="2.6" stroke-linecap="round"/><path d="M110,97 l-3,12" stroke="#3a7bd5" stroke-width="2.6" stroke-linecap="round"/><path d="M122,97 l-3,12" stroke="#3a7bd5" stroke-width="2.6" stroke-linecap="round"/><path d="M134,97 l-3,12" stroke="#3a7bd5" stroke-width="2.6" stroke-linecap="round"/><path d="M80,70.0 Q89,62.0 98,70.0 L98,96.0 Q89,100.0 80,96.0 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><path d="M97,69.4 Q106,61.4 115,69.4 L115,95.6 Q106,99.6 97,95.6 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><path d="M114,68.8 Q123,60.8 132,68.8 L132,95.2 Q123,99.2 114,95.2 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><path d="M131,68.2 Q140,60.2 149,68.2 L149,94.8 Q140,98.8 131,94.8 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><path d="M148,67.6 Q157,59.6 166,67.6 L166,94.4 Q157,98.4 148,94.4 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><path d="M165,67.0 Q174,59.0 183,67.0 L183,94.0 Q174,98.0 165,94.0 Z" fill="url(#b)" stroke="#167044" stroke-width="1.4"/><g class="t"><path d="M182,74 L206,62 L214,74 L206,82 L214,92 L206,104 L182,92 Z" fill="#ff8a3d" stroke="#c4501b" stroke-width="1.4"/><path d="M196,76 L210,74 M196,90 L210,92" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round"/></g><path d="M44,70 C46,62 60,58 82,60 L82,98 C62,100 46,96 42,86 Z" fill="#2fb36a" stroke="#167044" stroke-width="1.4"/><circle cx="50" cy="70" r="1.6" fill="#0f3d24"/><circle cx="58" cy="70" r="1.6" fill="#0f3d24"/><circle cx="66" cy="70" r="1.6" fill="#0f3d24"/><circle cx="74" cy="70" r="1.6" fill="#0f3d24"/><circle cx="50" cy="78" r="1.6" fill="#0f3d24"/><circle cx="58" cy="78" r="1.6" fill="#0f3d24"/><circle cx="66" cy="78" r="1.