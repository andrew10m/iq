<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160"><style>
.a{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.t{transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.3s ease-in-out infinite alternate}
.tf{transform-box:fill-box;transform-origin:0% 50%;animation:wag 2.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.f{transform-box:fill-box;transform-origin:50% 0%;animation:fin 1.1s ease-in-out infinite alternate}
.fr{transform-box:fill-box;transform-origin:0% 50%;animation:fin 1.1s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:100% 50%;animation:finl 1.1s ease-in-out infinite alternate}
@keyframes fin{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes finl{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
.l{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.g{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:1}}
.p{transform-box:fill-box;transform-origin:50% 0%;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06,.9)}}
.w{transform-box:fill-box;transform-origin:50% 0%;animation:wave 2.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{50%{transform:scale(.96,.78)}}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:sq 3s ease-in-out infinite}
@keyframes sq{50%{transform:scale(1.04,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6538"/><stop offset="1" stop-color="#5a4a28"/></linearGradient><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8f52"/><stop offset="1" stop-color="#a9b97a"/></linearGradient></defs><g class="a"><path class="fr" d="M176,88 C190,92 202,100 208,110 C196,110 184,104 174,96 Z" fill="url(#sk)"/><path class="f" style="transform-origin:30% 0%" d="M76,90 C68,110 60,128 46,140 C64,136 88,118 102,96 Z" fill="url(#sk)" stroke="#5f6e3a" stroke-width="1"/><path d="M58,76 C44,68 26,70 20,78 C18,86 28,92 40,92 C50,92 58,88 64,86 Z" fill="url(#sk)"/><path d="M20,80 L26,82" stroke="#4d5a2c" stroke-width="2"/><path d="M64,86 C90,98 160,98 182,86 C160,102 90,104 64,86 Z" fill="#e8dca8"/><path d="M58,86 C60,52 100,40 130,42 C160,44 186,60 186,86 C160,96 90,96 58,86 Z" fill="url(#sh)" stroke="#3e3218" stroke-width="1.6"/><path d="M80,66 L104,56 L130,54 L156,58 L174,72 M104,56 L106,84 M130,54 L132,86 M156,58 L156,84 M70,80 L106,84 L132,86 L156,84 L180,82" stroke="#3e3218" stroke-width="1.6" fill="none" opacity=".75"/><path d="M24,80 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M32,76 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M32,84 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M40,80 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M64,112 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M70,120 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><path d="M58,122 l4,-3 l4,3 l-4,3 Z" fill="none" stroke="#d8e2b8" stroke-width=".8" opacity=".7"/><circle cx="34" cy="78" r="3" fill="#0b1020"/><circle cx="33.0" cy="76.9" r="1.1" fill="#fff"/><ellipse class="l" cx="34" cy="78" rx="3.4" ry="3.4" fill="#8a9c5c"/></g></svg>