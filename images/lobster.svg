l="url(#b)" stroke="#262d21" stroke-width="1.4"/><g class="t"><path d="M190,72 L214,58 L222,70 L214,80 L222,90 L214,102 L190,88 Z" fill="#4a5541" stroke="#262d21" stroke-width="1.4"/></g><path d="M58,80 C58,68 72,62 96,62 C112,62 122,66 124,70 L124,90 C122,94 112,98 96,98 C72,98 58,92 58,80 Z" fill="url(#b)" stroke="#262d21" stroke-width="1.4"/><path d="M58,80 L40,80" stroke="#3d4836" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="73" r="2.6" fill="#0b0b0b"/><circle cx="60" cy="87" r="2.6" fill="#0b0b0b"/><path d="M70,70 C84,68 100,68 116,72 M70,90 C84,92 100,92 116,88" stroke="#6b7a5c" stroke-width="1.2" fill="none" opacity=".7"/></g></svg>